title: Child-agent service-tier inheritance
intro: >-
  Service-tier settings now follow the latest pi-agents child-agent hooks protocol,
  so spawned agents inherit provider defaults and active-session overrides. This release
  requires Pi 1.3.0 and pi-agents 0.36.0 or later.
