title: Per-process service tier defaults and additional account support
intro: >-
  Configure per-process service tier defaults with the --service-tier flag without
  modifying your global configuration file. Additional provider accounts on official
  endpoints now share their provider's service tier settings across session toggles,
  child agents, and the footer widget.
